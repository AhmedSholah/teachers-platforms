<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<div id="metrics"></div>
<script>
  var m = [
    innerWidth,
    innerHeight,
    devicePixelRatio,
    screen.width,
    matchMedia('(min-width:768px)').matches
  ].join(' | ')
  document.write('<h1>' + m + '</h1>')
</script>
</body>
</html>
